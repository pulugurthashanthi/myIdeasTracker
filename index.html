<div class="wrap"><header class="head"><div class="brand"><b>✳</b>My Idea Board</div><div class="toolbar"><button class="btn" id="importBtn">Paste / Import</button><button class="btn" id="exportBtn">Export</button></div></header><main id="home"><div class="title-row"><div><h1>Ideas</h1><p class="sub">Organize by project idea. Open a project to see its Kanban board.</p></div><div class="toolbar"><button class="btn" id="addTopicBtn">＋ Add project idea</button><button class="btn primary" id="addIdeaBtn">＋ Add card</button></div></div><nav class="tabs"><button class="tab active" data-view="topics">By topic</button><button class="tab" data-view="progress">In progress</button></nav><div class="summary" id="summary"></div><section id="topicView" class="board"></section><section id="progressView" class="project-grid" hidden></section></main>
<main id="projectDetail" hidden><header class="detail-head"><button class="btn" id="backBtn">← Back</button><div class="detail-title"><h1 id="projectTitle"></h1><p id="projectSummary" class="sub"></p></div><div class="toolbar"><button class="btn" id="shareProjectBtn">↗ Share idea</button><button class="btn primary" id="projectAddCard">＋ Add card</button></div></header><div class="detail-tools"><span class="help">Move cards by dragging them between lanes, or use each card’s status menu.</span></div><section class="board" id="kanban"></section></main></div>
<div class="shade" id="formShade"><section class="dialog" role="dialog" aria-modal="true"><h2 id="formTitle">New idea</h2><div id="ideaForm"><label for="ideaTitle">Card title</label><input id="ideaTitle" placeholder="A short title"><label for="ideaDescription">Details <span style="font-weight:400;color:#89938c">(optional)</span></label><textarea id="ideaDescription" placeholder="Add a few details..."></textarea><label for="ideaTopic">Project idea</label><select id="ideaTopic"></select></div><div id="topicForm" hidden><label for="topicTitle">Project idea title</label><input id="topicTitle" placeholder="e.g. Idea 1"></div><div id="importForm" hidden><p class="help">Paste one card per line. Use | between the title and details for the same card.</p><label for="importTopic">Project idea</label><select id="importTopic"></select><label for="importText">Cards</label><textarea id="importText" placeholder="Card title | details"></textarea></div><div class="buttons"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Add card</button></div></section></div>
<div class="shade" id="cardShade"><section class="dialog" role="dialog" aria-modal="true"><h2 id="cardDetailTitle"></h2><p id="cardDetailDescription" class="help"></p><p class="help">Project idea: <b id="cardDetailTopic"></b><span id="cardDetailDate"></span></p><label for="cardDetailStatus">Status</label><select id="cardDetailStatus"><option value="planned">Planned</option><option value="progress">In progress</option><option value="done">Done</option></select><h3 style="font-size:14px;margin:20px 0 8px">Progress updates</h3><div id="cardUpdateList" class="update-list"></div><label for="cardUpdateInput">Add an update</label><textarea id="cardUpdateInput" placeholder="What changed or what is next?"></textarea><div class="buttons"><button class="btn" id="cardDetailClose">Close</button><button class="btn primary" id="cardUpdateSave">Save update</button></div></section></div><div class="toast" id="toast"></div>
<script>
const KEY='idea-tracker-v3',V2='idea-tracker-v2',OLD='idea-board-columns-v1',STATES=[['planned','Planned'],['progress','In progress'],['done','Done']],BOARD_PALETTE=[['#BFE5D5','#86CBAA','#286B52'],['#FFD3A5','#F2AE70','#9A5028'],['#DDD0F4','#BAA3E0','#65478E'],['#BFDCEF','#91BCDE','#285D89'],['#F4E39A','#DFC45D','#756015'],['#F1C4D6','#DE94AF','#87405A'],['#BEE0DD','#82C5BF','#286B66'],['#F5C5BA','#E89B87','#96483A']];function boardPalette(i,custom){if(custom&&new RegExp('^#[0-9a-f]{6}$','i').test(custom)){const rgb=custom.slice(1).match(/\w\w/g).map(x=>parseInt(x,16)),mix=(a,b)=>Math.round(a+(b-a)*.72);return [`rgb(${mix(rgb[0],255)},${mix(rgb[1],255)},${mix(rgb[2],255)})`,`rgb(${mix(rgb[0],180)},${mix(rgb[1],180)},${mix(rgb[2],180)})`,custom]}return BOARD_PALETTE[i%BOARD_PALETTE.length]}const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function migrate(){try{const flat=JSON.parse(localStorage.getItem(V2)||'null');if(flat){const names=[...new Set(flat.map(i=>i.tag||'Ideas'))],topics=names.map((title,n)=>({id:'t'+n,title}));return{topics,ideas:flat.map(i=>({...i,topicId:topics.find(t=>t.title===(i.tag||'Ideas')).id,updates:i.updates||[]}))}}const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old){const cols=old.columns||old,ideas=[];cols.forEach((c,n)=>(c.ideas||[]).forEach((x,k)=>{if(typeof x==='string')x={text:x};const parts=(x.text||'').split('\n');ideas.push({id:x.id||`i${n}${k}`,title:x.title||parts.shift()||'Untitled card',description:x.description??parts.join('\n'),topicId:`t${n}`,status:x.status||'planned',completedAt:x.completedAt||null,updates:x.updates||[]})}));return{topics:cols.map((c,n)=>({id:`t${n}`,title:c.title||`Idea ${n+1}`})),ideas}}}catch{}return{topics:[{id:'t'+Date.now(),title:'Idea 1'},{id:'t'+(Date.now()+1),title:'Idea 2'},{id:'t'+(Date.now()+2),title:'Idea 3'}],ideas:[]}}let sharedProject=readSharedProject(),state=sharedProject?{topics:[{id:'shared-project',title:sharedProject.title||'Shared idea',color:sharedProject.color}],ideas:(sharedProject.cards||[]).map((i,n)=>({...i,id:'shared-'+n,topicId:'shared-project',updates:Array.isArray(i.updates)?i.updates:[]}))}:JSON.parse(localStorage.getItem(KEY)||'null')||migrate(),view='topics',selectedTopic=sharedProject?'shared-project':'',selectedCard='',formMode='card',isShared=!!sharedProject;if(!state.topics.length)state.topics=[{id:'t'+Date.now(),title:'Ideas'}];state.ideas=state.ideas.map(i=>({...i,topicId:i.topicId||state.topics.find(t=>t.title===i.tag)?.id||state.topics[0].id,status:i.status||'planned',updates:i.updates||[]}));function readSharedProject(){const m=location.hash.match(/^#project=([A-Za-z0-9_-]+)$/);if(!m)return null;try{const raw=m[1].replace(/-/g,'+').replace(/_/g,'/'),padded=raw+'='.repeat((4-raw.length%4)%4),bytes=Uint8Array.from(atob(padded),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch{return null}}async function shareProject(id){const t=state.topics.find(x=>x.id===id);if(!t)return;const payload={title:t.title,color:t.color,cards:state.ideas.filter(i=>i.topicId===id).map(i=>({title:i.title,description:i.description,status:i.status,completedAt:i.completedAt,updates:i.updates||[]}))},bytes=new TextEncoder().encode(JSON.stringify(payload));let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));const token=btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const url=location.origin+location.pathname+'#project='+token;try{await navigator.clipboard.writeText(url);toast('Project link copied')}catch{window.prompt('Copy this project idea link:',url)}}function persist(){localStorage.setItem(KEY,JSON.stringify(state));window.cloudSave&&window.cloudSave(state)}function label(s){return STATES.find(x=>x[0]===s)?.[1]||'Planned'}function makeCard(i){return `<article class="idea-card" data-card="${i.id}" tabindex="0"><h3>${esc(i.title)}</h3>${i.description?`<p>${esc(i.description)}</p>`:''}<div class="card-foot"><span class="tag" data-status="${esc(i.status)}">${esc(label(i.status))}</span><span>${i.updates.length?`${i.updates.length} update${i.updates.length===1?'':'s'}`:''}</span></div></article>`}function renderSummary(){const n=state.ideas;$('#summary').innerHTML=STATES.map(([s,l])=>`<span data-status="${s}"><b>${n.filter(i=>i.status===s).length}</b> ${l.toLowerCase()}</span>`).join('')}function renderHome(){renderSummary();$('#summary').hidden=view==='progress';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));$('#topicView').hidden=view!== 'topics';$('#progressView').hidden=view!== 'progress';$('#topicView').innerHTML=state.topics.map((t,i)=>{const count=state.ideas.filter(i=>i.topicId===t.id).length,palette=boardPalette(i,t.color);return `<section class="column${t.collapsed?' collapsed':''}" data-topic="${t.id}" style="--board-bg:${palette[0]};--board-head:${palette[1]};--board-accent:${palette[2]}"><div class="colhead"><button class="topic-toggle" data-toggle-topic="${t.id}" aria-expanded="${!t.collapsed}" aria-label="${t.collapsed?'Expand':'Collapse'} project idea">${t.collapsed?'▶':'▼'}</button><input class="coltitle" data-title="${t.id}" value="${esc(t.title)}" aria-label="Project idea title"><input class="color-picker" type="color" data-color-topic="${t.id}" value="${esc(palette[2])}" aria-label="Choose colour for ${esc(t.title)}">${t.collapsed?`<span class="topic-count">${count} card${count===1?'':'s'}</span>`:''}<button class="remove" data-del-topic="${t.id}" title="Remove project idea">×</button></div>${t.collapsed?'':`<div class="cards">${state.ideas.filter(i=>i.topicId===t.id).map(makeCard).join('')}</div><button class="add-card" data-add-card="${t.id}">＋ Add a card</button>`}</section>`}).join('');$('#topicView').querySelectorAll('[data-toggle-topic]').forEach(el=>el.onclick=()=>{const t=state.topics.find(x=>x.id===el.dataset.toggleTopic);if(t){t.collapsed=!t.collapsed;persist( ,'dragging'))};root.querySelectorAll('.colhead').forEach(header=>{header.onpointerdown=e=>{if(e.target.closest('.topic-toggle,.remove,.coltitle,.topic-count,.color-picker'))return;if(e.pointerType==='mouse'&&e.button!==0)return;const column=header.closest('.column');drag={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,column,id:column.dataset.topic,active:false,header};try{header.setPointerCapture(e.pointerId)}catch{}e.preventDefault()};header.onpointermove=e=>{if(!drag||e.pointerId!==drag.pointerId)return;const distance=Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY);if(!drag.active&&distance<7)return;if(!drag.active){drag.active=true;drag.column.classList.add('dragging')}clearDrop();const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.column');if(!hit||hit===drag.column)return;root.querySelectorAll('.column').forEach(col=>col.classList.remove('drop-before','drop-after'));const rect=hit.getBoundingClientRect();const mobile=matchMedia('(max-width:760px)').matches;const after=mobile?e.clientY>rect.top+rect.height/2:e.clientX>rect.left+rect.width/2;hit.classList.add(after?'drop-after':'drop-before');drag.target={id:hit.dataset.topic,after}};header.onpointerup=e=>{if(!drag||e.pointerId!==drag.pointerId)return;if(drag.active&&drag.target){const from=state.topics.findIndex(t=>t.id===drag.id),target=state.topics.findIndex(t=>t.id===drag.target.id);if(from>=0&&target>=0){const [item]=state.topics.splice(from,1);let insert=state.topics.findIndex(t=>t.id===drag.target.id)+(drag.target.after?1:0);if(insert<0)insert=state.topics.length;state.topics.splice(insert,0,item);drag=null;persist();renderHome();return}}clear();try{header.releasePointerCapture(e.pointerId)}catch{}drag=null};header.onpointercancel=()=>{if(drag){clear();drag=null}}}) ;function clearDrop(){root.querySelectorAll('.column.drop-before,.column.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'))}}
function renderKanban(){const topic=state.topics.find(t=>t.id===selectedTopic);if(!topic)return;$('#projectTitle').textContent=topic.title;const cards=state.ideas.filter(i=>i.topicId===selectedTopic);$('#projectSummary').textContent=`${cards.length} card${cards.length===1?'':'s'} · ${cards.filter(i=>i.status==='done').length} completed`;const topicIndex=state.topics.findIndex(t=>t.id===selectedTopic),palette=boardPalette(topicIndex<0?0:topicIndex,topic.color);$('#kanban').innerHTML=STATES.map(([s,l])=>{const list=cards.filter(i=>i.status===s);return `<section class="column lane" data-status="${s}" style="--board-accent:${palette[2]}"><div class="lane-head"><span class="lane-name"><i class="dot"></i>${l}</span><span class="lane-count">${list.length}</span></div><div class="dropzone" data-drop="${s}">${list.map(i=>`<article class="work-card" draggable="${!isShared}" data-drag="${i.id}"><h3 data-open-card="${i.id}">${esc(i.title)}</h3>${i.description?`<p>${esc(i.description)}</p>`:''}${i.status==='done'&&i.completedAt?`<small>✓ Completed ${esc(i.completedAt)}</small>`:''}<div class="work-tools"><select data-status-card="${i.id}" aria-label="Card status" ${isShared?'disabled':''}>${STATES.map(([v,t])=>`<option value="${v}" ${i.status===v?'selected':''}>${t}</option>`).join('')}</select><button data-open-card="${i.id}" ${isShared?'disabled':''}>${i.updates.length?`Updates (${i.updates.length})`:'Add update'}</button></div></article>`).join('')}</div></section>`}).join('');$('#kanban').querySelectorAll('[data-drop]').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.closest('.lane').style.outline='2px solid #b8cbbc'};el.ondragleave=()=>el.closest('.lane').style.outline='';el.ondrop=e=>{e.preventDefault();el.closest('.lane').style.outline='';const id=e.dataTransfer.getData('text/plain');changeCardStatus(id,el.dataset.drop)}});$('#kanban').querySelectorAll('[data-drag]').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.drag));$('#kanban').querySelectorAll('[data-status-card]').forEach(el=>el.onchange=()=>changeCardStatus(el.dataset.statusCard,el.value));$('#kanban').querySelectorAll('[data-open-card]').forEach(el=>el.onclick=e=>{e.stopPropagation();openCardDetail(el.dataset.openCard)})}function changeCardStatus(id,s){if(isShared)return;const i=state.ideas.find(x=>x.id===id);if(!i)return;i.status=s;i.completedAt=s==='done'?new Date().toLocaleDateString():null;persist();renderHome();renderKanban()}function openProject(id){selectedTopic=id;$('#home').hidden=true;$('#projectDetail').hidden=false;renderKanban();window.scrollTo(0,0)}function openForm(mode,topicId=''){formMode=mode;$('#formTitle').textContent=mode==='topic'?'New project idea':mode==='import'?'Paste cards':'New card';$('#ideaForm').hidden=mode!=='card';$('#topicForm').hidden=mode!=='topic';$('#importForm').hidden=mode!=='import';$('#saveBtn').textContent=mode==='topic'?'Add project idea':mode==='import'?'Import cards':'Add card';if(mode==='card'||mode==='import'){const sel=mode==='card'?$('#ideaTopic'):$('#importTopic');sel.innerHTML=state.topics.map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('');if(topicId)sel.value=topicId}$('#ideaTitle').value='';$('#ideaDescription').value='';$('#topicTitle').value='';$('#importText').value='';$('#formShade').classList.add('show')}function closeForm(){$('#formShade').classList.remove('show')}function openCardDetail(id){if(isShared)return;selectedCard=id;const i=state.ideas.find(x=>x.id===id),t=state.topics.find(x=>x.id===i?.topicId);if(!i)return;$('#cardDetailTitle').textContent=i.title;$('#cardDetailDescription').textContent=i.description||'';$('#cardDetailTopic').textContent=t?.title||'';$('#cardDetailStatus').value=i.status;$('#cardDetailDate').textContent=i.completedAt?' · Completed '+i.completedAt:'';$('#cardUpdateInput').value='';renderCardUpdates(i);$('#cardShade').classList.add('show')}function renderCardUpdates(i){$('#cardUpdateList').innerHTML=i.updates.length?[...i.updates].reverse().map(u=>`<article class="update"><p>${esc(u.text)}</p><time>${esc(u.at)}</time></article>`).join(''):'<p class="help">No updates yet.</p>'}function closeCardDetail(){$('#cardShade').classList.remove('show')}function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function addCard(title,description,topicId){state.ideas.unshift({id:'i'+Date.now()+Math.random().toString(36).slice(2,6),title,description,topicId,status:'planned',completedAt:null,updates:[]})}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;renderHome()});$('#topicView').addEventListener('click',e=>{if(e.target.closest('[data-add-card]'))return;const c=e.target.closest('[data-card]');if(c)openCardDetail(c.dataset.card)});$('#topicView').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-card]')){e.preventDefault();openCardDetail(e.target.dataset.card)}});$('#progressView').addEventListener('click',e=>{const s=e.target.closest('[data-share-project]');if(s){e.stopPropagation();shareProject(s.dataset.shareProject);return}const p=e.target.closest('[data-project]');if(p)openProject(p.dataset.project)});$('#progressView').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-project]')){e.preventDefault();openProject(e.target.dataset.project)}});$('#addTopicBtn').onclick=()=>openForm('topic');$('#addIdeaBtn').onclick=()=>openForm('card',state.topics[0]?.id);$('#importBtn').onclick=()=>openForm('import',state.topics[0]?.id);$('#projectAddCard').onclick=()=>openForm('card',selectedTopic);$('#shareProjectBtn').onclick=()=>shareProject(selectedTopic);$('#cancelBtn').onclick=closeForm;$('#formShade').onclick=e=>{if(e.target===$('#formShade'))closeForm()};$('#saveBtn').onclick=()=>{if(formMode==='topic'){const title=$('#topicTitle').value.trim();if(!title)return;state.topics.push({id:'t'+Date.now(),title});persist();renderHome();closeForm()}else if(formMode==='card'){const title=$('#ideaTitle').value.trim();if(!title)return;addCard(title,$('#ideaDescription').value.trim(),$('#ideaTopic').value);persist();renderHome();closeForm();if(!$('#projectDetail').hidden)renderKanban()}else{const topicId=$('#importTopic').value,rows=$('#importText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!rows.length)return;rows.forEach(row=>{const [title,...rest]=row.split('|');addCard(title.trim(),rest.join('\n').trim(),topicId)});persist();renderHome();closeForm();if(!$('#projectDetail').hidden)renderKanban();toast(`${rows.length} card${rows.length===1?'':'s'} imported`)}};$('#backBtn').onclick=()=>{$('#projectDetail').hidden=true;$('#home').hidden=false;selectedTopic='';renderHome();window.scrollTo(0,0)};$('#cardDetailStatus').onchange=()=>{const i=state.ideas.find(x=>x.id===selectedCard);if(!i)return;i.status=$('#cardDetailStatus').value;i.completedAt=i.status==='done'?new Date().toLocaleDateString():null;persist();renderHome();renderKanban();$('#cardDetailDate').textContent=i.completedAt?' · Completed '+i.completedAt:''};$('#cardUpdateSave').onclick=()=>{if(isShared)return;const i=state.ideas.find(x=>x.id===selectedCard),text=$('#cardUpdateInput').value.trim();if(!i||!text)return;i.updates.push({text,at:new Date().toLocaleString()});persist();renderHome();renderKanban();renderCardUpdates(i);$('#cardUpdateInput').value=''};$('#cardDetailClose').onclick=closeCardDetail;$('#cardShade').onclick=e=>{if(e.target===$('#cardShade'))closeCardDetail()};$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='my-idea-board.json';a.click();URL.revokeObjectURL(a.href);toast('Board exported')};document.onkeydown=e=>{if(e.key==='Escape'){closeForm();closeCardDetail()}};if(isShared){$('#home').hidden=true;$('#projectDetail').hidden=false;$('#backBtn').hidden=true;$('#projectAddCard').hidden=true;$('#shareProje
