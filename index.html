<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Idea Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f6;color:#27312b;font:14px Arial,sans-serif}.wrap{max-width:1300px;margin:auto;padding:28px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{font-size:17px;font-weight:700}.brand b{display:inline-grid;place-items:center;background:#315d48;color:#fff;width:28px;height:28px;border-radius:7px;margin-right:8px}.btn{background:#fff;border:1px solid #dfe4de;border-radius:7px;padding:9px 13px;color:#334239;cursor:pointer;font-weight:600}.btn:hover{border-color:#829b89}.primary{background:#315d48;color:#fff;border-color:#315d48}.title-row{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}h1{font-size:28px;margin:0 0 7px}.sub{color:#7a857e;margin:0}.tabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid #e1e6e0}.tab{background:none;border:0;padding:10px 13px;color:#79847c;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:#315d48;border-bottom-color:#315d48}.stats{display:flex;gap:18px;flex-wrap:wrap;color:#748078;font-size:12px;margin:0 0 15px}.stats b{color:#34453a}.board{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px;align-items:start}.column{background:#eef1ed;border:1px solid #e3e8e2;border-radius:9px;padding:12px;min-height:240px}.colhead{display:flex;align-items:center;gap:7px;margin:0 0 11px}.coltitle{flex:1;min-width:0;border:0;background:transparent;font-size:15px;font-weight:700;color:#29352d;padding:5px 3px;outline:none}.coltitle:focus{background:#fff;border-radius:5px;box-shadow:0 0 0 1px #cbd8cd}.remove-col{border:0;background:transparent;color:#a2aaa3;font-size:17px;cursor:pointer}.remove-col:hover{color:#a34e42}.cards{display:grid;gap:8px}.card{background:#fff;border:1px solid #e7ebe6;border-radius:7px;padding:11px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;color:#38443b}.card[data-open]{cursor:pointer}.card[data-open]:hover{border-color:#afc2b2;box-shadow:0 2px 8px #2d4c3713}.card p{margin:0 0 9px}.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid #f0f2ef}.topic{font-size:10px;color:#819087;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{border:1px solid #e4e8e3;background:#fafbf9;color:#59685e;border-radius:5px;padding:5px 6px;font-size:10px;cursor:pointer;max-width:120px}.status[data-status="progress"]{background:#fff5df;border-color:#f2e2bb;color:#916a22}.status[data-status="done"]{background:#e9f4eb;border-color:#d5e7d8;color:#42724d}.done-date{font-size:10px;color:#839087;margin-top:7px}.add-card{width:100%;margin-top:10px;padding:8px;text-align:left;border:1px dashed #cbd4cb;background:transparent;border-radius:6px;color:#68776d;cursor:pointer}.add-card:hover{background:#fff}.add-column{margin-top:14px}.lane-title{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;margin:2px 1px 12px}.lane-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;background:#a4b49f}.lane[data-lane="progress"] .lane-dot{background:#d3a744}.lane[data-lane="done"] .lane-dot{background:#5d9b69}.lane-count{font-size:11px;font-weight:500;color:#849087;background:#fff;padding:3px 7px;border-radius:99px}.lane{min-height:280px}.empty{grid-column:1/-1;border:1px dashed #cbd4cb;border-radius:9px;padding:36px;text-align:center;color:#77837a}.shade{position:fixed;inset:0;background:#14201988;display:none;place-items:center;padding:20px;z-index:5}.shade.show{display:grid}.dialog{width:min(440px,100%);background:#fff;border-radius:12px;padding:22px;box-shadow:0 18px 60px #0002}.dialog h2{margin:0 0 14px;font-size:19px}.dialog label{display:block;font-weight:600;font-size:12px;margin:13px 0 6px}.dialog input,.dialog textarea,.dialog select{width:100%;padding:11px;border:1px solid #dfe4de;border-radius:7px;font:14px Arial;outline:none;background:#fff}.dialog textarea{height:120px;resize:vertical}.dialog input:focus,.dialog textarea:focus,.dialog select:focus{border-color:#829b89;box-shadow:0 0 0 3px #e8f0ea}.help{font-size:12px;color:#768279;line-height:1.5;margin:-3px 0 10px}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#273b30;color:#fff;padding:10px 15px;border-radius:7px;display:none;z-index:10}@media(max-width:760px){.wrap{padding:20px 14px}.head{margin-bottom:28px}.board{grid-template-columns:1fr}.column{min-height:140px}.title-row{align-items:flex-start;gap:12px;flex-direction:column}.stats{gap:10px}}
</style></head><body>
<div class="wrap"><header class="head"><div class="brand"><b>✳</b>My Idea Board</div><div style="display:flex;gap:8px"><button class="btn" id="import">Paste / Import</button><button class="btn" id="export">Export</button></div></header><div class="title-row"><div><h1>My ideas</h1><p class="sub">Group ideas by topic and keep track as they move forward.</p></div><div style="display:flex;gap:8px"><button class="btn" id="addColumn">＋ Add column</button><button class="btn primary" id="addIdea">＋ Add idea</button></div></div><nav class="tabs"><button class="tab active" data-view="topics">By topic</button><button class="tab" data-view="progress">Progress</button></nav><div class="stats" id="stats"></div><main class="board" id="board"></main></div>
<div class="shade" id="shade"><section class="dialog" role="dialog" aria-modal="true"><h2 id="dialogTitle">New idea</h2><div id="ideaFields"><label for="ideaText">Idea</label><textarea id="ideaText" placeholder="Write an idea..."></textarea><label for="ideaColumn">Topic</label><select id="ideaColumn"></select></div><div id="columnFields" hidden><label for="columnTitle">Column title</label><input id="columnTitle" placeholder="e.g. Ideas to try"></div><div id="importFields" hidden><p class="help">Paste one idea per line. A | within a line becomes a line break inside that same card.</p><label for="importColumn">Add to topic</label><select id="importColumn"></select><label for="importText">Ideas</label><textarea id="importText" placeholder="Idea title | detail on a new line"></textarea></div><div class="buttons"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Add idea</button></div></section></div><div class="toast" id="toast"></div>
<div class="shade" id="detailShade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><h2 id="detailTitle">Idea progress</h2><p id="detailBody" style="line-height:1.55;color:#526157;white-space:pre-wrap"></p><p class="help">Topic: <b id="detailTopic"></b><span id="detailDate"></span></p><label for="detailStatus">Status</label><select id="detailStatus"><option value="planned">Planned</option><option value="progress">In progress</option><option value="done">Done</option></select><h3 style="font-size:14px;margin:20px 0 8px">Progress updates</h3><div id="updateList" class="cards"></div><label for="updateText">Add an update</label><textarea id="updateText" placeholder="What changed or what is next?"></textarea><div class="buttons"><button class="btn" id="detailClose">Close</button><button class="btn primary" id="saveUpdate">Save update</button></div></section></div><script>
const KEY='idea-board-columns-v1';let data=JSON.parse(localStorage.getItem(KEY)||'null')||[{id:'c1',title:'Idea 1',ideas:[]},{id:'c2',title:'Idea 2',ideas:[]},{id:'c3',title:'Idea 3',ideas:[]}];let view='topics',mode='idea',target='';data.forEach(c=>c.ideas=c.ideas.map(i=>typeof i==='string'?{id:'i'+Math.random().toString(36).slice(2),text:i,status:'planned',completedAt:null,updates:[]}:({...i,status:i.status||'planned',updates:i.updates||[]})));const $=s=>document.querySelector(s),statuses=[['planned','Planned'],['progress','In progress'],['done','Done']];function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function counts(){const all=data.flatMap(c=>c.ideas);return{planned:all.filter(i=>i.status==='planned').length,progress:all.filter(i=>i.status==='progress').length,done:all.filter(i=>i.status==='done').length}}function cardHtml(i,c){return `<article class="card" data-open="${i.id}" tabindex="0"><p>${esc(i.text).replace(/\n/g,'<br>')}</p><div class="card-meta"><span class="topic">${esc(c.title)}</span><select class="status" data-idea="${i.id}" aria-label="Idea status" data-status="${i.status}">${statuses.map(([v,l])=>`<option value="${v}" ${i.status===v?'selected':''}>${l}</option>`).join('')}</select></div>${i.status==='done'&&i.completedAt?`<div class="done-date">✓ Completed ${esc(i.completedAt)}</div>`:''}</article>`}function render(){const ct=counts();$('#stats').innerHTML=`<span><b>${ct.planned}</b> planned</span><span><b>${ct.progress}</b> in progress</span><span><b>${ct.done}</b> completed</span>`;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));const root=$('#board');if(view==='topics'){root.innerHTML=data.length?data.map(c=>`<section class="column"><div class="colhead"><input class="coltitle" data-title="${c.id}" value="${esc(c.title)}" aria-label="Column title"><button class="remove-col" data-remove="${c.id}" title="Remove column" aria-label="Remove column">×</button></div><div class="cards">${c.ideas.map(i=>cardHtml(i,c)).join('')}</div><button class="add-card" data-add="${c.id}">＋ Add an idea</button></section>`).join(''):'<div class="empty">No columns yet. Add a topic column to start your board.</div>';root.querySelectorAll('[data-title]').forEach(el=>el.onchange=()=>{const c=data.find(x=>x.id===el.dataset.title);if(c){c.title=el.value.trim()||'Untitled';persist();render()}});root.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>open('idea',el.dataset.add));root.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{data=data.filter(c=>c.id!==el.dataset.remove);persist();render()})}else{root.innerHTML=statuses.map(([s,label])=>{const matching=data.flatMap(c=>c.ideas.filter(i=>i.status===s).map(i=>({i,c})));return `<section class="column lane" data-lane="${s}"><div class="lane-title"><span><i class="lane-dot"></i>${label}</span><span class="lane-count">${matching.length}</span></div><div class="cards">${matching.map(({i,c})=>cardHtml(i,c)).join('')||'<div style="font-size:12px;color:#9aa39c;padding:12px 3px">No ideas here yet</div>'}</div></section>`}).join('')}root.querySelectorAll('[data-idea]').forEach(el=>el.onchange=()=>{for(const c of data){const i=c.ideas.find(x=>x.id===el.dataset.idea);if(i){i.status=el.value;i.completedAt=i.status==='done'?new Date().toLocaleDateString():null;break}}persist();render()})}function fillSelect(sel,chosen){sel.innerHTML=data.map(c=>`<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('');if(chosen)sel.value=chosen}function open(m,id=''){mode=m;target=id;$('#ideaFields').hidden=m!=='idea';$('#columnFields').hidden=m!=='column';$('#importFields').hidden=m!=='import';$('#dialogTitle').textContent=m==='column'?'New column':m==='import'?'Paste ideas':'New idea';$('#save').textContent=m==='column'?'Add column':m==='import'?'Import ideas':'Add idea';if(m==='idea'){fillSelect($('#ideaColumn'),id);$('#ideaText').value=''}if(m==='column')$('#columnTitle').value='';if(m==='import'){fillSelect($('#importColumn'),id);$('#importText').value=''}$('#shade').classList.add('show');(m==='idea'?$('#ideaText'):m==='column'?$('#columnTitle'):$('#importText')).focus()}function close(){$('#shade').classList.remove('show')}function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function saveAll(){persist();render();close()}$('#addColumn').onclick=()=>open('column');$('#addIdea').onclick=()=>open('idea',data[0]?.id);$('#import').onclick=()=>open('import',data[0]?.id);$('#cancel').onclick=close;$('#shade').onclick=e=>{if(e.target===$('#shade'))close()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});$('#save').onclick=()=>{if(mode==='column'){const title=$('#columnTitle').value.trim();if(!title){$('#columnTitle').focus();return}data.push({id:'c'+Date.now(),title,ideas:[]});saveAll()}else if(mode==='idea'){const text=$('#ideaText').value.trim(),c=data.find(x=>x.id===$('#ideaColumn').value);if(!text||!c){$('#ideaText').focus();return}c.ideas.push({id:'i'+Date.now(),text,status:'planned',completedAt:null,updates:[]});saveAll()}else{const c=data.find(x=>x.id===$('#importColumn').value),ideas=$('#importText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/\s*\|\s*/g,'\n'));if(!c||!ideas.length){$('#importText').focus();return}ideas.forEach((text,n)=>c.ideas.push({id:'i'+Date.now()+n,text,status:'planned',completedAt:null,updates:[]}));saveAll();toast(`${ideas.length} idea${ideas.length===1?'':'s'} imported`)}};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({columns:data},null,2)],{type:'application/json'}));a.download='my-idea-board.json';a.click();URL.revokeObjectURL(a.href);toast('Board exported')};function currentIdea(){for(const c of data){const i=c.ideas.find(x=>x.id===currentDetail);if(i)return{i,c}}return null}
function drawUpdates(i){const list=$('#updateList');list.innerHTML=i.updates?.length?[...i.updates].reverse().map(u=>`<article class="card"><p>${esc(u.text)}</p><span class="topic">${esc(u.at)}</span></article>`).join(''):'<p class="help">No updates yet. Add a note when you start or make progress.</p>'}
function openDetail(id){currentDetail=id;const f=currentIdea();if(!f)return;$('#detailTitle').textContent=f.i.text.split('\n')[0]||'Idea progress';$('#detailBody').innerHTML=esc(f.i.text).replace(/\n/g,'<br>');$('#detailTopic').textContent=f.c.title;$('#detailStatus').value=f.i.status;$('#detailDate').textContent=f.i.completedAt?' · Completed '+f.i.completedAt:'';$('#updateText').value='';drawUpdates(f.i);$('#detailShade').classList.add('show')}
function closeDetail(){$('#detailShade').classList.remove('show')}
let currentDetail='';$('#board').addEventListener('click',e=>{if(e.target.closest('select'))return;const card=e.target.closest('[data-open]');if(card)openDetail(card.dataset.open)});$('#board').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();openDetail(e.target.dataset.open)}});
$('#detailStatus').onchange=()=>{const f=currentIdea();if(!f)return;f.i.status=$('#detailStatus').value;f.i.completedAt=f.i.status==='done'?new Date().toLocaleDateString():null;persist();render();$('#detailDate').textContent=f.i.completedAt?' · Completed '+f.i.completedAt:''};
$('#saveUpdate').onclick=()=>{const f=currentIdea(),text=$('#updateText').value.trim();if(!f||!text)return;f.i.updates=f.i.updates||[];f.i.updates.push({text,at:new Date().toLocaleString()});persist();render();drawUpdates(f.i);$('#updateText').value=''};$('#detailClose').onclick=closeDetail;$('#detailShade').onclick=e=>{if(e.target===$('#detailShade'))closeDetail()};document.onkeydown=e=>{if(e.key==='Escape'){close();closeDetail()}};persist();render();
</script></body></html>
