<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Idea Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f6;color:#27312b;font:14px Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:30px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:46px}.brand{font-size:17px;font-weight:700}.brand b{display:inline-grid;place-items:center;background:#315d48;color:#fff;width:28px;height:28px;border-radius:7px;margin-right:8px}.btn{background:#fff;border:1px solid #dfe4de;border-radius:7px;padding:9px 13px;color:#334239;cursor:pointer;font-weight:600}.btn:hover{border-color:#829b89}.primary{background:#315d48;color:#fff;border-color:#315d48}.title-row{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}h1{font-size:29px;margin:0 0 7px}.sub{color:#7a857e;margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.idea-tile{background:#fff;border:1px solid #e3e8e2;border-radius:9px;padding:16px;min-height:145px;cursor:pointer;transition:box-shadow .15s,border-color .15s;box-shadow:0 2px 6px #1f332408}.idea-tile:hover{border-color:#afc2b2;box-shadow:0 5px 14px #2d4c3710}.idea-tile h2{font-size:16px;margin:0 0 9px;line-height:1.35}.idea-tile p{color:#657169;line-height:1.5;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.tile-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#869189;font-size:10px}.tag{background:#f0f3ef;border-radius:99px;padding:4px 8px}.badge{border-radius:99px;padding:4px 8px;font-size:10px;background:#edf1ec;color:#5d6a60}.badge.progress{background:#fff3d9;color:#946f27}.badge.done{background:#e7f2e8;color:#47764f}.empty{grid-column:1/-1;min-height:220px;border:1px dashed #cbd4cb;border-radius:9px;display:grid;place-items:center;text-align:center;color:#77837a;padding:30px}.empty strong{display:block;color:#46554b;margin-bottom:7px;font-size:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.counts{display:flex;gap:14px;margin:0 0 20px;color:#768279;font-size:12px;flex-wrap:wrap}.counts b{color:#35483a}.detail-head{display:flex;align-items:center;gap:13px;margin-bottom:18px}.detail-head h1{margin:0}.detail-title{flex:1}.idea-description{color:#66736a;line-height:1.55;white-space:pre-wrap;margin:8px 0 18px}.detail-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0 20px}.detail-tools label{font-size:12px;color:#6f7b72}.detail-tools select,.form select{border:1px solid #dfe4de;border-radius:7px;background:#fff;padding:9px;color:#34443a;font:13px Arial}.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}.lane{background:#eef1ed;border:1px solid #e3e8e2;border-radius:9px;padding:12px;min-height:220px}.lane-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:12px}.lane-name{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#a4b49f}.lane[data-status="progress"] .dot{background:#d3a744}.lane[data-status="done"] .dot{background:#5d9b69}.lane-count{font-size:11px;font-weight:500;color:#849087;background:#fff;padding:3px 7px;border-radius:99px}.dropzone{min-height:160px}.work-card{background:#fff;border:1px solid #e5e9e3;border-radius:7px;padding:12px;line-height:1.5;cursor:grab;box-shadow:0 2px 5px #29372d08}.work-card:active{cursor:grabbing}.work-card h3{font-size:14px;margin:0 0 7px}.work-card p{margin:0;color:#68746c;white-space:pre-wrap}.work-card small{display:block;color:#87928a;margin-top:10px;font-size:10px}.updates{margin-top:22px;background:#fff;border:1px solid #e3e8e2;border-radius:9px;padding:16px}.updates h2{font-size:15px;margin:0 0 12px}.update-form{display:flex;gap:8px;align-items:flex-start}.update-form textarea{flex:1;min-height:72px;resize:vertical;border:1px solid #dfe4de;border-radius:7px;padding:10px;font:13px Arial}.update-list{display:grid;gap:8px;margin-top:13px}.update{border-top:1px solid #eef0ed;padding:10px 0 0}.update p{margin:0 0 5px;white-space:pre-wrap;line-height:1.5}.update time{font-size:10px;color:#87928a}.shade{position:fixed;inset:0;background:#14201988;display:none;place-items:center;padding:20px;z-index:5}.shade.show{display:grid}.dialog{width:min(460px,100%);background:#fff;border-radius:12px;padding:22px;box-shadow:0 18px 60px #0002}.dialog h2{margin:0 0 14px;font-size:19px}.dialog label{display:block;font-weight:600;font-size:12px;margin:13px 0 6px}.dialog input,.dialog textarea,.dialog select{width:100%;padding:11px;border:1px solid #dfe4de;border-radius:7px;font:14px Arial;outline:none;background:#fff}.dialog textarea{height:115px;resize:vertical}.dialog input:focus,.dialog textarea:focus,.dialog select:focus{border-color:#829b89;box-shadow:0 0 0 3px #e8f0ea}.help{font-size:12px;color:#768279;line-height:1.5;margin:-3px 0 10px}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#273b30;color:#fff;padding:10px 15px;border-radius:7px;display:none;z-index:10}@media(max-width:760px){.wrap{padding:20px 14px}.head{margin-bottom:32px}.title-row{align-items:flex-start;gap:14px;flex-direction:column}.kanban{grid-template-columns:1fr}.lane{min-height:145px}.detail-head{align-items:flex-start;flex-wrap:wrap}.detail-head .detail-title{min-width:calc(100% - 70px)}.update-form{flex-direction:column}.update-form textarea{width:100%}}
</style></head><body>
<div class="wrap"><header class="head"><div class="brand"><b>✳</b>My Idea Board</div><div class="toolbar"><button class="btn" id="importBtn">Paste / Import</button><button class="btn" id="exportBtn">Export</button></div></header><main id="homeView"><div class="title-row"><div><h1>Ideas</h1><p class="sub">Click an idea tile to open its progress board.</p></div><button class="btn primary" id="addBtn">＋ Add idea</button></div><div class="counts" id="counts"></div><section class="tiles" id="tiles"></section></main><main id="detailView" hidden><header class="detail-head"><button class="btn" id="backBtn">← All ideas</button><div class="detail-title"><h1 id="detailTitle"></h1><p id="detailTag" class="sub"></p></div></header><p id="detailDescription" class="idea-description"></p><div class="detail-tools"><label for="statusSelect">Move idea:</label><select id="statusSelect"><option value="planned">Planned</option><option value="progress">In progress</option><option value="done">Done</option></select><span class="help" id="completedDate"></span></div><section class="kanban" id="kanban"></section><section class="updates"><h2>Progress updates</h2><div class="update-form"><textarea id="updateInput" placeholder="Add a progress note or next step..."></textarea><button class="btn primary" id="addUpdate">Add update</button></div><div class="update-list" id="updateList"></div></section></main></div>
<div class="shade" id="shade"><section class="dialog" role="dialog" aria-modal="true"><h2 id="formTitle">New idea</h2><div class="form" id="ideaForm"><label for="ideaTitle">Title</label><input id="ideaTitle" placeholder="A short title for your idea"><label for="ideaDescription">Details <span style="font-weight:400;color:#89938c">(optional)</span></label><textarea id="ideaDescription" placeholder="Add a few details..."></textarea><label for="ideaTag">Topic <span style="font-weight:400;color:#89938c">(optional)</span></label><input id="ideaTag" placeholder="e.g. Product, Home, Learning"></div><div class="form" id="importForm" hidden><p class="help">Paste one idea per line. Use | between the title and details; it stays within one tile.</p><textarea id="importText" placeholder="Idea title | details on the same idea"></textarea></div><div class="buttons"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Add idea</button></div></section></div><div class="toast" id="toast"></div>
<script>
const KEY='idea-tracker-v2',OLD='idea-board-columns-v1',STATES=[['planned','Planned'],['progress','In progress'],['done','Done']];const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fromOld(){try{const old=JSON.parse(localStorage.getItem(OLD)||'null');if(!old)return[];return(old.columns||old).flatMap(c=>(c.ideas||[]).map(x=>{if(typeof x==='string')x={text:x};const parts=(x.text||'').split('\n');return{id:x.id||'i'+Math.random().toString(36).slice(2),title:x.title||parts.shift()||'Untitled idea',description:x.description??parts.join('\n'),tag:x.tag||c.title||'',status:x.status||'planned',completedAt:x.completedAt||null,updates:x.updates||[]}}))}catch{return[]}}let ideas=JSON.parse(localStorage.getItem(KEY)||'null')||fromOld();let selected='',formMode='new';function persist(){localStorage.setItem(KEY,JSON.stringify(ideas))}function statusName(s){return STATES.find(x=>x[0]===s)?.[1]||'Planned'}function renderHome(){const counts=STATES.map(([s,l])=>`${ideas.filter(i=>i.status===s).length} ${l.toLowerCase()}`);$('#counts').innerHTML=counts.map(x=>`<span><b>${x.split(' ')[0]}</b> ${esc(x.split(' ').slice(1).join(' '))}</span>`).join('');$('#tiles').innerHTML=ideas.length?ideas.map(i=>`<article class="idea-tile" data-open="${i.id}" tabindex="0"><h2>${esc(i.title)}</h2>${i.description?`<p>${esc(i.description)}</p>`:''}<div class="tile-foot"><span class="tag">${esc(i.tag||'Idea')}</span><span class="badge ${i.status}">${statusName(i.status)}</span></div></article>`).join(''):`<div class="empty"><div><strong>Your idea board is empty</strong>Add an idea to create your first tile.<br><button class="btn primary" style="margin-top:14px" onclick="openForm('new')">＋ Add idea</button></div></div>`}function renderKanban(){const idea=ideas.find(i=>i.id===selected);if(!idea)return;$('#detailTitle').textContent=idea.title;$('#detailTag').textContent=idea.tag||'Idea';$('#detailDescription').textContent=idea.description||'';$('#statusSelect').value=idea.status;$('#completedDate').textContent=idea.completedAt?'Completed '+idea.completedAt:'';$('#kanban').innerHTML=STATES.map(([s,l])=>`<section class="lane" data-status="${s}"><div class="lane-head"><span class="lane-name"><i class="dot"></i>${l}</span><span class="lane-count">${idea.status===s?'1':'0'}</span></div><div class="dropzone" data-drop="${s}">${idea.status===s?`<article class="work-card" draggable="true" data-drag="${idea.id}"><h3>${esc(idea.title)}</h3>${idea.description?`<p>${esc(idea.description)}</p>`:''}${idea.status==='done'&&idea.completedAt?`<small>✓ Completed ${esc(idea.completedAt)}</small>`:''}</article>`:''}</div></section>`).join('');$('#kanban').querySelectorAll('[data-drop]').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.closest('.lane').style.outline='2px solid #b8cbbc'};el.ondragleave=()=>el.closest('.lane').style.outline='';el.ondrop=e=>{e.preventDefault();el.closest('.lane').style.outline='';moveIdea(el.dataset.drop)}});$('#kanban').querySelectorAll('[data-drag]').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.drag));$('#updateList').innerHTML=idea.updates.length?[...idea.updates].reverse().map(u=>`<article class="update"><p>${esc(u.text)}</p><time>${esc(u.at)}</time></article>`).join(''):'<p class="help">No updates yet. Add a note as you make progress.</p>'}function showDetail(id){selected=id;$('#homeView').hidden=true;$('#detailView').hidden=false;renderKanban();window.scrollTo(0,0)}function moveIdea(s){const i=ideas.find(x=>x.id===selected);if(!i)return;i.status=s;i.completedAt=s==='done'?new Date().toLocaleDateString():null;persist();renderKanban();renderHome()}function openForm(mode){formMode=mode;$('#formTitle').textContent=mode==='import'?'Paste ideas':'New idea';$('#ideaForm').hidden=mode==='import';$('#importForm').hidden=mode!=='import';$('#saveBtn').textContent=mode==='import'?'Import ideas':'Add idea';$('#ideaTitle').value='';$('#ideaDescription').value='';$('#ideaTag').value='';$('#importText').value='';$('#shade').classList.add('show');(mode==='import'?$('#importText'):$('#ideaTitle')).focus()}function closeForm(){$('#shade').classList.remove('show')}function toast(text){const t=$('#toast');t.textContent=text;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function makeIdea(title,description='',tag=''){return{id:'i'+Date.now()+Math.random().toString(36).slice(2,6),title,description,tag,status:'planned',completedAt:null,updates:[]}}$('#tiles').addEventListener('click',e=>{const tile=e.target.closest('[data-open]');if(tile)showDetail(tile.dataset.open)});$('#tiles').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();showDetail(e.target.dataset.open)}});$('#backBtn').onclick=()=>{$('#detailView').hidden=true;$('#homeView').hidden=false;selected='';renderHome();window.scrollTo(0,0)};$('#statusSelect').onchange=()=>moveIdea($('#statusSelect').value);$('#addUpdate').onclick=()=>{const i=ideas.find(x=>x.id===selected),text=$('#updateInput').value.trim();if(!i||!text)return;i.updates.push({text,at:new Date().toLocaleString()});$('#updateInput').value='';persist();renderKanban()};$('#addBtn').onclick=()=>openForm('new');$('#importBtn').onclick=()=>openForm('import');$('#cancelBtn').onclick=closeForm;$('#shade').onclick=e=>{if(e.target===$('#shade'))closeForm()};$('#saveBtn').onclick=()=>{if(formMode==='new'){const title=$('#ideaTitle').value.trim();if(!title){$('#ideaTitle').focus();return}ideas.unshift(makeIdea(title,$('#ideaDescription').value.trim(),$('#ideaTag').value.trim()));persist();renderHome();closeForm();return}const rows=$('#importText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!rows.length){$('#importText').focus();return}rows.forEach(row=>{const [title,...rest]=row.split('|');ideas.unshift(makeIdea(title.trim(),rest.join('\n').trim()))});persist();renderHome();closeForm();toast(`${rows.length} idea${rows.length===1?'':'s'} imported`)};$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({ideas},null,2)],{type:'application/json'}));a.download='my-ideas.json';a.click();URL.revokeObjectURL(a.href);toast('Ideas exported')};document.onkeydown=e=>{if(e.key==='Escape')closeForm()};if(!localStorage.getItem(KEY)){persist()}renderHome();
</script></body></html>
