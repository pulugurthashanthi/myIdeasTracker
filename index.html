<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Idea Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f6;color:#27312b;font:14px Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{font-size:17px;font-weight:700}.brand b{display:inline-grid;place-items:center;background:#315d48;color:#fff;width:28px;height:28px;border-radius:7px;margin-right:8px}.btn{background:#fff;border:1px solid #dfe4de;border-radius:7px;padding:9px 13px;color:#334239;cursor:pointer;font-weight:600}.btn:hover{border-color:#829b89}.primary{background:#315d48;color:#fff;border-color:#315d48}.toolbar{display:flex;gap:8px}.title-row{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:18px}h1{font-size:28px;margin:0 0 7px}.sub{color:#7a857e;margin:0}.tabs{display:flex;gap:8px;border-bottom:1px solid #e2e7e1;margin-bottom:16px}.tab{background:none;border:0;border-bottom:2px solid transparent;color:#7a857e;font-weight:600;padding:10px 12px;cursor:pointer}.tab.active{color:#315d48;border-color:#315d48}.summary{display:flex;gap:15px;flex-wrap:wrap;color:#758179;font-size:12px;margin:0 0 15px}.summary b{color:#35483a}.board{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:14px;align-items:start}.column{background:#eef1ed;border:1px solid #e3e8e2;border-radius:9px;padding:12px;min-height:220px}.colhead{display:flex;align-items:center;gap:6px;margin-bottom:10px}.coltitle{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:15px;color:#29352d;padding:5px 3px;outline:none}.coltitle:focus{background:#fff;border-radius:5px;box-shadow:0 0 0 1px #cbd8cd}.remove{border:0;background:transparent;color:#a2aaa3;font-size:17px;cursor:pointer}.cards{display:grid;gap:8px}.idea-card{background:#fff;border:1px solid #e5e9e3;border-radius:7px;padding:12px;line-height:1.48;cursor:pointer;box-shadow:0 2px 5px #29372d08;transition:.15s}.idea-card:hover,.project-tile:hover{border-color:#afc2b2;box-shadow:0 4px 12px #2d4c3710}.idea-card h3{font-size:14px;margin:0 0 7px}.idea-card p{color:#68746c;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;color:#87928a;font-size:10px}.tag{background:#f0f3ef;border-radius:99px;padding:4px 8px}.badge{border-radius:99px;padding:4px 8px;font-size:10px;background:#edf1ec;color:#5d6a60}.badge.progress{background:#fff3d9;color:#946f27}.badge.done{background:#e7f2e8;color:#47764f}.add-card{width:100%;margin-top:10px;padding:8px;text-align:left;border:1px dashed #cbd4cb;background:transparent;border-radius:6px;color:#68776d;cursor:pointer}.add-card:hover{background:#fff}.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}.project-tile{background:#fff;border:1px solid #e5e9e3;border-radius:9px;padding:16px;min-height:140px;cursor:pointer;box-shadow:0 2px 6px #1f332408;transition:.15s}.project-tile h2{font-size:16px;margin:0 0 10px}.project-tile p{margin:0;color:#758179;font-size:12px;line-height:1.5}.project-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:11px;color:#768279}.project-stats b{color:#35483a}.empty{grid-column:1/-1;min-height:180px;border:1px dashed #cbd4cb;border-radius:9px;display:grid;place-items:center;text-align:center;color:#77837a;padding:28px}.empty strong{display:block;color:#46554b;margin-bottom:7px;font-size:15px}.lane-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:12px}.lane-name{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#a4b49f}.lane[data-status="progress"] .dot{background:#d3a744}.lane[data-status="done"] .dot{background:#5d9b69}.lane-count{font-size:11px;font-weight:500;color:#849087;background:#fff;padding:3px 7px;border-radius:99px}.dropzone{min-height:155px}.work-card{background:#fff;border:1px solid #e5e9e3;border-radius:7px;padding:11px;line-height:1.45;box-shadow:0 2px 5px #29372d08}.work-card[draggable=true]{cursor:grab}.work-card h3{font-size:13px;margin:0 0 6px;cursor:pointer}.work-card p{margin:0;color:#68746c;white-space:pre-wrap;font-size:12px}.work-card small{display:block;color:#87928a;margin-top:8px;font-size:10px}.work-tools{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:6px}.work-tools select{border:1px solid #e4e8e3;background:#fafbf9;color:#59685e;border-radius:5px;padding:4px 5px;font-size:10px}.work-tools button{border:0;background:none;color:#718077;font-size:10px;cursor:pointer;padding:4px}.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.detail-title{flex:1}.detail-title h1{margin:0 0 5px}.detail-meta{color:#68746c;line-height:1.5;margin:6px 0 18px}.detail-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}.updates{margin-top:22px;background:#fff;border:1px solid #e3e8e2;border-radius:9px;padding:16px}.updates h2{font-size:15px;margin:0 0 12px}.update-form{display:flex;gap:8px;align-items:flex-start}.update-form textarea{flex:1;min-height:72px;resize:vertical;border:1px solid #dfe4de;border-radius:7px;padding:10px;font:13px Arial}.update-list{display:grid;gap:8px;margin-top:13px}.update{border-top:1px solid #eef0ed;padding:10px 0 0}.update p{margin:0 0 5px;white-space:pre-wrap;line-height:1.5}.update time{font-size:10px;color:#87928a}.shade{position:fixed;inset:0;background:#14201988;display:none;place-items:center;padding:20px;z-index:5}.shade.show{display:grid}.dialog{width:min(460px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:12px;padding:22px;box-shadow:0 18px 60px #0002}.dialog h2{margin:0 0 14px;font-size:19px}.dialog label{display:block;font-weight:600;font-size:12px;margin:13px 0 6px}.dialog input,.dialog textarea,.dialog select{width:100%;padding:11px;border:1px solid #dfe4de;border-radius:7px;font:14px Arial;outline:none;background:#fff}.dialog textarea{height:105px;resize:vertical}.dialog input:focus,.dialog textarea:focus,.dialog select:focus{border-color:#829b89;box-shadow:0 0 0 3px #e8f0ea}.help{font-size:12px;color:#768279;line-height:1.5}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#273b30;color:#fff;padding:10px 15px;border-radius:7px;display:none;z-index:10}@media(max-width:760px){.wrap{padding:20px 14px}.head{margin-bottom:26px}.title-row{align-items:flex-start;flex-direction:column}.board{grid-template-columns:1fr}.column{min-height:130px}.detail-head{align-items:flex-start}.detail-title{min-width:140px}.update-form{flex-direction:column}.update-form textarea{width:100%}}
</style></head><body>
<div class="wrap"><header class="head"><div class="brand"><b>✳</b>My Idea Board</div><div class="toolbar"><button class="btn" id="importBtn">Paste / Import</button><button class="btn" id="exportBtn">Export</button></div></header><main id="home"><div class="title-row"><div><h1>Ideas</h1><p class="sub">Organize by project idea. Open a project to see its Kanban board.</p></div><div class="toolbar"><button class="btn" id="addTopicBtn">＋ Add project idea</button><button class="btn primary" id="addIdeaBtn">＋ Add card</button></div></div><nav class="tabs"><button class="tab active" data-view="topics">By topic</button><button class="tab" data-view="progress">In progress</button></nav><div class="summary" id="summary"></div><section id="topicView" class="board"></section><section id="progressView" class="project-grid" hidden></section></main>
<main id="projectDetail" hidden><header class="detail-head"><button class="btn" id="backBtn">← Back</button><div class="detail-title"><h1 id="projectTitle"></h1><p id="projectSummary" class="sub"></p></div><button class="btn primary" id="projectAddCard">＋ Add card</button></header><div class="detail-tools"><span class="help">Move cards by dragging them between lanes, or use each card’s status menu.</span></div><section class="board" id="kanban"></section></main></div>
<div class="shade" id="formShade"><section class="dialog" role="dialog" aria-modal="true"><h2 id="formTitle">New idea</h2><div id="ideaForm"><label for="ideaTitle">Card title</label><input id="ideaTitle" placeholder="A short title"><label for="ideaDescription">Details <span style="font-weight:400;color:#89938c">(optional)</span></label><textarea id="ideaDescription" placeholder="Add a few details..."></textarea><label for="ideaTopic">Project idea</label><select id="ideaTopic"></select></div><div id="topicForm" hidden><label for="topicTitle">Project idea title</label><input id="topicTitle" placeholder="e.g. Idea 1"></div><div id="importForm" hidden><p class="help">Paste one card per line. Use | between the title and details for the same card.</p><label for="importTopic">Project idea</label><select id="importTopic"></select><label for="importText">Cards</label><textarea id="importText" placeholder="Card title | details"></textarea></div><div class="buttons"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Add card</button></div></section></div>
<div class="shade" id="cardShade"><section class="dialog" role="dialog" aria-modal="true"><h2 id="cardDetailTitle"></h2><p id="cardDetailDescription" class="help"></p><p class="help">Project idea: <b id="cardDetailTopic"></b><span id="cardDetailDate"></span></p><label for="cardDetailStatus">Status</label><select id="cardDetailStatus"><option value="planned">Planned</option><option value="progress">In progress</option><option value="done">Done</option></select><h3 style="font-size:14px;margin:20px 0 8px">Progress updates</h3><div id="cardUpdateList" class="update-list"></div><label for="cardUpdateInput">Add an update</label><textarea id="cardUpdateInput" placeholder="What changed or what is next?"></textarea><div class="buttons"><button class="btn" id="cardDetailClose">Close</button><button class="btn primary" id="cardUpdateSave">Save update</button></div></section></div><div class="toast" id="toast"></div>
<script>
const KEY='idea-tracker-v3',V2='idea-tracker-v2',OLD='idea-board-columns-v1',STATES=[['planned','Planned'],['progress','In progress'],['done','Done']];const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function migrate(){try{const flat=JSON.parse(localStorage.getItem(V2)||'null');if(flat){const names=[...new Set(flat.map(i=>i.tag||'Ideas'))],topics=names.map((title,n)=>({id:'t'+n,title}));return{topics,ideas:flat.map(i=>({...i,topicId:topics.find(t=>t.title===(i.tag||'Ideas')).id,updates:i.updates||[]}))}}const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old){const cols=old.columns||old,ideas=[];cols.forEach((c,n)=>(c.ideas||[]).forEach((x,k)=>{if(typeof x==='string')x={text:x};const parts=(x.text||'').split('\n');ideas.push({id:x.id||`i${n}${k}`,title:x.title||parts.shift()||'Untitled card',description:x.description??parts.join('\n'),topicId:`t${n}`,status:x.status||'planned',completedAt:x.completedAt||null,updates:x.updates||[]})}));return{topics:cols.map((c,n)=>({id:`t${n}`,title:c.title||`Idea ${n+1}`})),ideas}}}catch{}return{topics:[{id:'t'+Date.now(),title:'Idea 1'},{id:'t'+(Date.now()+1),title:'Idea 2'},{id:'t'+(Date.now()+2),title:'Idea 3'}],ideas:[]}}let state=JSON.parse(localStorage.getItem(KEY)||'null')||migrate(),view='topics',selectedTopic='',selectedCard='',formMode='card';if(!state.topics.length)state.topics=[{id:'t'+Date.now(),title:'Ideas'}];state.ideas=state.ideas.map(i=>({...i,topicId:i.topicId||state.topics.find(t=>t.title===i.tag)?.id||state.topics[0].id,status:i.status||'planned',updates:i.updates||[]}));function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function label(s){return STATES.find(x=>x[0]===s)?.[1]||'Planned'}function makeCard(i){return `<article class="idea-card" data-card="${i.id}" tabindex="0"><h3>${esc(i.title)}</h3>${i.description?`<p>${esc(i.description)}</p>`:''}<div class="card-foot"><span class="tag">${esc(label(i.status))}</span><span>${i.updates.length?`${i.updates.length} update${i.updates.length===1?'':'s'}`:''}</span></div></article>`}function renderSummary(){const n=state.ideas;$('#summary').innerHTML=STATES.map(([s,l])=>`<span><b>${n.filter(i=>i.status===s).length}</b> ${l.toLowerCase()}</span>`).join('')}function renderHome(){renderSummary();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));$('#topicView').hidden=view!=='topics';$('#progressView').hidden=view!=='progress';$('#topicView').innerHTML=state.topics.map(t=>`<section class="column"><div class="colhead"><input class="coltitle" data-title="${t.id}" value="${esc(t.title)}" aria-label="Project idea title"><button class="remove" data-del-topic="${t.id}" title="Remove project idea">×</button></div><div class="cards">${state.ideas.filter(i=>i.topicId===t.id).map(makeCard).join('')}</div><button class="add-card" data-add-card="${t.id}">＋ Add a card</button></section>`).join('');$('#topicView').querySelectorAll('[data-title]').forEach(el=>el.onchange=()=>{const t=state.topics.find(x=>x.id===el.dataset.title);if(t){t.title=el.value.trim()||'Untitled';persist();renderHome()}});$('#topicView').querySelectorAll('[data-del-topic]').forEach(el=>el.onclick=()=>{const id=el.dataset.delTopic;state.topics=state.topics.filter(t=>t.id!==id);if(!state.topics.length)state.topics.push({id:'t'+Date.now(),title:'Ideas'});state.ideas.filter(i=>i.topicId===id).forEach(i=>i.topicId=state.topics[0].id);persist();renderHome()});$('#topicView').querySelectorAll('[data-add-card]').forEach(el=>el.onclick=()=>openForm('card',el.dataset.addCard));$('#progressView').innerHTML=state.topics.length?state.topics.map(t=>{const list=state.ideas.filter(i=>i.topicId===t.id),done=list.filter(i=>i.status==='done').length,working=list.filter(i=>i.status==='progress').length;return `<article class="project-tile" data-project="${t.id}" tabindex="0"><h2>${esc(t.title)}</h2><p>${list.length} card${list.length===1?'':'s'} in this project idea</p><div class="project-stats"><span><b>${working}</b> in progress</span><span><b>${done}</b> done</span></div></article>`}).join(''):'<div class="empty">Add a project idea to get started.</div>'}function renderKanban(){const topic=state.topics.find(t=>t.id===selectedTopic);if(!topic)return;$('#projectTitle').textContent=topic.title;const cards=state.ideas.filter(i=>i.topicId===selectedTopic);$('#projectSummary').textContent=`${cards.length} card${cards.length===1?'':'s'} · ${cards.filter(i=>i.status==='done').length} completed`;$('#kanban').innerHTML=STATES.map(([s,l])=>{const list=cards.filter(i=>i.status===s);return `<section class="column lane" data-status="${s}"><div class="lane-head"><span class="lane-name"><i class="dot"></i>${l}</span><span class="lane-count">${list.length}</span></div><div class="dropzone" data-drop="${s}">${list.map(i=>`<article class="work-card" draggable="true" data-drag="${i.id}"><h3 data-open-card="${i.id}">${esc(i.title)}</h3>${i.description?`<p>${esc(i.description)}</p>`:''}${i.status==='done'&&i.completedAt?`<small>✓ Completed ${esc(i.completedAt)}</small>`:''}<div class="work-tools"><select data-status-card="${i.id}" aria-label="Card status">${STATES.map(([v,t])=>`<option value="${v}" ${i.status===v?'selected':''}>${t}</option>`).join('')}</select><button data-open-card="${i.id}">${i.updates.length?`Updates (${i.updates.length})`:'Add update'}</button></div></article>`).join('')}</div></section>`}).join('');$('#kanban').querySelectorAll('[data-drop]').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.closest('.lane').style.outline='2px solid #b8cbbc'};el.ondragleave=()=>el.closest('.lane').style.outline='';el.ondrop=e=>{e.preventDefault();el.closest('.lane').style.outline='';const id=e.dataTransfer.getData('text/plain');changeCardStatus(id,el.dataset.drop)}});$('#kanban').querySelectorAll('[data-drag]').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.drag));$('#kanban').querySelectorAll('[data-status-card]').forEach(el=>el.onchange=()=>changeCardStatus(el.dataset.statusCard,el.value));$('#kanban').querySelectorAll('[data-open-card]').forEach(el=>el.onclick=e=>{e.stopPropagation();openCardDetail(el.dataset.openCard)})}function changeCardStatus(id,s){const i=state.ideas.find(x=>x.id===id);if(!i)return;i.status=s;i.completedAt=s==='done'?new Date().toLocaleDateString():null;persist();renderHome();renderKanban()}function openProject(id){selectedTopic=id;$('#home').hidden=true;$('#projectDetail').hidden=false;renderKanban();window.scrollTo(0,0)}function openForm(mode,topicId=''){formMode=mode;$('#formTitle').textContent=mode==='topic'?'New project idea':mode==='import'?'Paste cards':'New card';$('#ideaForm').hidden=mode!=='card';$('#topicForm').hidden=mode!=='topic';$('#importForm').hidden=mode!=='import';$('#saveBtn').textContent=mode==='topic'?'Add project idea':mode==='import'?'Import cards':'Add card';if(mode==='card'||mode==='import'){const sel=mode==='card'?$('#ideaTopic'):$('#importTopic');sel.innerHTML=state.topics.map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('');if(topicId)sel.value=topicId}$('#ideaTitle').value='';$('#ideaDescription').value='';$('#topicTitle').value='';$('#importText').value='';$('#formShade').classList.add('show')}function closeForm(){$('#formShade').classList.remove('show')}function openCardDetail(id){selectedCard=id;const i=state.ideas.find(x=>x.id===id),t=state.topics.find(x=>x.id===i?.topicId);if(!i)return;$('#cardDetailTitle').textContent=i.title;$('#cardDetailDescription').textContent=i.description||'';$('#cardDetailTopic').textContent=t?.title||'';$('#cardDetailStatus').value=i.status;$('#cardDetailDate').textContent=i.completedAt?' · Completed '+i.completedAt:'';$('#cardUpdateInput').value='';renderCardUpdates(i);$('#cardShade').classList.add('show')}function renderCardUpdates(i){$('#cardUpdateList').innerHTML=i.updates.length?[...i.updates].reverse().map(u=>`<article class="update"><p>${esc(u.text)}</p><time>${esc(u.at)}</time></article>`).join(''):'<p class="help">No updates yet.</p>'}function closeCardDetail(){$('#cardShade').classList.remove('show')}function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function addCard(title,description,topicId){state.ideas.unshift({id:'i'+Date.now()+Math.random().toString(36).slice(2,6),title,description,topicId,status:'planned',completedAt:null,updates:[]})}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;renderHome()});$('#topicView').addEventListener('click',e=>{if(e.target.closest('[data-add-card]'))return;const c=e.target.closest('[data-card]');if(c)openCardDetail(c.dataset.card)});$('#topicView').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-card]')){e.preventDefault();openCardDetail(e.target.dataset.card)}});$('#progressView').addEventListener('click',e=>{const p=e.target.closest('[data-project]');if(p)openProject(p.dataset.project)});$('#progressView').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-project]')){e.preventDefault();openProject(e.target.dataset.project)}});$('#addTopicBtn').onclick=()=>openForm('topic');$('#addIdeaBtn').onclick=()=>openForm('card',state.topics[0]?.id);$('#importBtn').onclick=()=>openForm('import',state.topics[0]?.id);$('#projectAddCard').onclick=()=>openForm('card',selectedTopic);$('#cancelBtn').onclick=closeForm;$('#formShade').onclick=e=>{if(e.target===$('#formShade'))closeForm()};$('#saveBtn').onclick=()=>{if(formMode==='topic'){const title=$('#topicTitle').value.trim();if(!title)return;state.topics.push({id:'t'+Date.now(),title});persist();renderHome();closeForm()}else if(formMode==='card'){const title=$('#ideaTitle').value.trim();if(!title)return;addCard(title,$('#ideaDescription').value.trim(),$('#ideaTopic').value);persist();renderHome();closeForm();if(!$('#projectDetail').hidden)renderKanban()}else{const topicId=$('#importTopic').value,rows=$('#importText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!rows.length)return;rows.forEach(row=>{const [title,...rest]=row.split('|');addCard(title.trim(),rest.join('\n').trim(),topicId)});persist();renderHome();closeForm();if(!$('#projectDetail').hidden)renderKanban();toast(`${rows.length} card${rows.length===1?'':'s'} imported`)}};$('#backBtn').onclick=()=>{$('#projectDetail').hidden=true;$('#home').hidden=false;selectedTopic='';renderHome();window.scrollTo(0,0)};$('#cardDetailStatus').onchange=()=>{const i=state.ideas.find(x=>x.id===selectedCard);if(!i)return;i.status=$('#cardDetailStatus').value;i.completedAt=i.status==='done'?new Date().toLocaleDateString():null;persist();renderHome();renderKanban();$('#cardDetailDate').textContent=i.completedAt?' · Completed '+i.completedAt:''};$('#cardUpdateSave').onclick=()=>{const i=state.ideas.find(x=>x.id===selectedCard),text=$('#cardUpdateInput').value.trim();if(!i||!text)return;i.updates.push({text,at:new Date().toLocaleString()});persist();renderHome();renderKanban();renderCardUpdates(i);$('#cardUpdateInput').value=''};$('#cardDetailClose').onclick=closeCardDetail;$('#cardShade').onclick=e=>{if(e.target===$('#cardShade'))closeCardDetail()};$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='my-idea-board.json';a.click();URL.revokeObjectURL(a.href);toast('Board exported')};document.onkeydown=e=>{if(e.key==='Escape'){closeForm();closeCardDetail()}};if(!localStorage.getItem(KEY))persist();renderHome();
</script></body></html>
