<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Idea Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f6;color:#27312b;font:14px Arial,sans-serif}.wrap{max-width:1300px;margin:auto;padding:30px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:46px}.brand{font-size:17px;font-weight:700}.brand b{display:inline-grid;place-items:center;background:#315d48;color:white;width:28px;height:28px;border-radius:7px;margin-right:8px}.btn{background:#fff;border:1px solid #dfe4de;border-radius:7px;padding:9px 13px;color:#334239;cursor:pointer;font-weight:600}.btn:hover{border-color:#829b89}.title-row{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}h1{font-size:28px;margin:0 0 7px}.sub{color:#7a857e;margin:0}.board{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px;align-items:start}.column{background:#eef1ed;border:1px solid #e3e8e2;border-radius:9px;padding:12px;min-height:245px}.colhead{display:flex;align-items:center;gap:7px;margin:0 0 11px}.coltitle{flex:1;min-width:0;border:0;background:transparent;font-size:15px;font-weight:700;color:#29352d;padding:5px 3px;outline:none}.coltitle:focus{background:white;border-radius:5px;box-shadow:0 0 0 1px #cbd8cd}.remove-col{border:0;background:transparent;color:#a2aaa3;font-size:17px;cursor:pointer}.remove-col:hover{color:#a34e42}.cards{display:grid;gap:8px}.card{background:white;border:1px solid #e7ebe6;border-radius:6px;padding:11px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;min-height:45px;color:#38443b}.add-card{width:100%;margin-top:10px;padding:8px;text-align:left;border:1px dashed #cbd4cb;background:transparent;border-radius:6px;color:#68776d;cursor:pointer}.add-card:hover{background:#fff}.add-column{margin-top:14px}.empty{grid-column:1/-1;border:1px dashed #cbd4cb;border-radius:9px;padding:36px;text-align:center;color:#77837a}.shade{position:fixed;inset:0;background:#14201988;display:none;place-items:center;padding:20px}.shade.show{display:grid}.dialog{width:min(440px,100%);background:#fff;border-radius:12px;padding:22px;box-shadow:0 18px 60px #0002}.dialog h2{margin:0 0 14px;font-size:19px}.dialog label{display:block;font-weight:600;font-size:12px;margin:13px 0 6px}.dialog input,.dialog textarea,.dialog select{width:100%;padding:11px;border:1px solid #dfe4de;border-radius:7px;font:14px Arial;outline:none;background:#fff}.dialog textarea{height:150px;resize:vertical}.dialog input:focus,.dialog textarea:focus,.dialog select:focus{border-color:#829b89;box-shadow:0 0 0 3px #e8f0ea}.help{font-size:12px;color:#768279;line-height:1.5;margin:-3px 0 10px}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.primary{background:#315d48;color:#fff;border-color:#315d48}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#273b30;color:#fff;padding:10px 15px;border-radius:7px;display:none}@media(max-width:760px){.wrap{padding:20px 14px}.head{margin-bottom:36px}.board{grid-template-columns:1fr}.column{min-height:160px}.title-row{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body>
<div class="wrap"><header class="head"><div class="brand"><b>✳</b>My Idea Board</div><div style="display:flex;gap:8px"><button class="btn" id="import">Paste / Import</button><button class="btn" id="export">Export</button></div></header><div class="title-row"><div><h1>My ideas</h1><p class="sub">Organize ideas under your own headings.</p></div><button class="btn" id="addColumn">＋ Add column</button></div><main class="board" id="board"></main></div>
<div class="shade" id="shade"><section class="dialog" role="dialog" aria-modal="true"><h2 id="dialogTitle">New idea</h2><div id="ideaFields"><label for="ideaText">Idea</label><textarea id="ideaText" placeholder="Write an idea..."></textarea></div><div id="columnFields" hidden><label for="columnTitle">Column title</label><input id="columnTitle" placeholder="e.g. Ideas to try"></div><div id="importFields" hidden><p class="help">Paste one idea per line. A | within a line becomes a line break inside that same card.</p><label for="importColumn">Add to column</label><select id="importColumn"></select><label for="importText">Ideas</label><textarea id="importText" placeholder="Idea one | detail on a new line"></textarea></div><div class="buttons"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Add idea</button></div></section></div><div class="toast" id="toast"></div>
<script>
const KEY='idea-board-columns-v1';let data=JSON.parse(localStorage.getItem(KEY)||'null')||[{id:'c1',title:'Idea 1',ideas:[]},{id:'c2',title:'Idea 2',ideas:[]},{id:'c3',title:'Idea 3',ideas:[]}];let mode='idea',target='';const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveData(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){const root=$('#board');root.innerHTML=data.length?data.map(col=>`<section class="column"><div class="colhead"><input class="coltitle" data-title="${col.id}" value="${esc(col.title)}" aria-label="Column title"><button class="remove-col" data-remove="${col.id}" title="Remove column" aria-label="Remove column">×</button></div><div class="cards">${col.ideas.map(i=>`<article class="card">${esc(i).replace(/\n/g,'<br>')}</article>`).join('')}</div><button class="add-card" data-add="${col.id}">＋ Add an idea</button></section>`).join(''):'<div class="empty">No columns yet. Add a column to start your board.</div>';root.querySelectorAll('[data-title]').forEach(el=>{el.onchange=()=>{const col=data.find(c=>c.id===el.dataset.title);if(col){col.title=el.value.trim()||'Untitled';saveData()}}});root.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>open('idea',el.dataset.add));root.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{data=data.filter(c=>c.id!==el.dataset.remove);saveData();render()})}function open(m,id=''){mode=m;target=id;$('#ideaFields').hidden=m!=='idea';$('#columnFields').hidden=m!=='column';$('#importFields').hidden=m!=='import';$('#dialogTitle').textContent=m==='column'?'New column':m==='import'?'Paste ideas':'New idea';$('#save').textContent=m==='column'?'Add column':m==='import'?'Import ideas':'Add idea';if(m==='idea')$('#ideaText').value='';if(m==='column')$('#columnTitle').value='';if(m==='import'){const select=$('#importColumn');select.innerHTML=data.map(c=>`<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('');if(id)select.value=id;$('#importText').value=''}$('#shade').classList.add('show');(m==='idea'?$('#ideaText'):m==='column'?$('#columnTitle'):$('#importText')).focus()}function close(){ $('#shade').classList.remove('show')}function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}$('#addColumn').onclick=()=>open('column');$('#import').onclick=()=>open('import');$('#cancel').onclick=close;$('#shade').onclick=e=>{if(e.target===$('#shade'))close()};$('#save').onclick=()=>{if(mode==='column'){const title=$('#columnTitle').value.trim();if(!title){$('#columnTitle').focus();return}data.push({id:'c'+Date.now(),title,ideas:[]})}else if(mode==='idea'){const text=$('#ideaText').value.trim();if(!text){$('#ideaText').focus();return}data.find(c=>c.id===target)?.ideas.push(text)}else{const col=data.find(c=>c.id===$('#importColumn').value);const ideas=$('#importText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/\s*\|\s*/g,'\n'));if(!col||!ideas.length){$('#importText').focus();return}col.ideas.push(...ideas);toast(`${ideas.length} idea${ideas.length===1?'':'s'} imported`)}saveData();render();close()};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({columns:data},null,2)],{type:'application/json'}));a.download='my-idea-board.json';a.click();URL.revokeObjectURL(a.href);toast('Board exported')};document.onkeydown=e=>{if(e.key==='Escape')close()};render();
</script></body></html>
