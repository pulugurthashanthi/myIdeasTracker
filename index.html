<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Idea Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f6;color:#27312b;font:14px Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{font-size:17px;font-weight:700}.brand b{display:inline-grid;place-items:center;background:#315d48;color:#fff;width:28px;height:28px;border-radius:7px;margin-right:8px}.btn{background:#fff;border:1px solid #dfe4de;border-radius:7px;padding:9px 13px;color:#334239;cursor:pointer;font-weight:600}.btn:hover{border-color:#829b89}.primary{background:#315d48;color:#fff;border-color:#315d48}.toolbar{display:flex;gap:8px}.title-row{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:18px}h1{font-size:28px;margin:0 0 7px}.sub{color:#7a857e;margin:0}.tabs{display:flex;gap:8px;border-bottom:1px solid #e2e7e1;margin-bottom:16px}.tab{background:none;border:0;border-bottom:2px solid transparent;color:#7a857e;font-weight:600;padding:10px 12px;cursor:pointer}.tab.active{color:#315d48;border-color:#315d48}.summary{display:flex;gap:15px;flex-wrap:wrap;color:#758179;font-size:12px;margin:0 0 15px}.summary b{color:#35483a}.board{display:grid;grid-template-columns:repeat(3,minmax(210px,1fr));gap:14px;align-items:start}.column{background:#eef1ed;border:1px solid #e3e8e2;border-radius:9px;padding:12px;min-height:220px}.colhead{display:flex;align-items:center;gap:6px;margin-bottom:10px}.coltitle{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:15px;color:#29352d;padding:5px 3px;outline:none}.coltitle:focus{background:#fff;border-radius:5px;box-shadow:0 0 0 1px #cbd8cd}.remove{border:0;background:transparent;color:#a2aaa3;font-size:17px;cursor:pointer}.cards{display:grid;gap:8px}.idea-card{background:#fff;border:1px solid #e5e9e3;border-radius:7px;padding:12px;line-height:1.48;cursor:pointer;box-shadow:0 2px 5px #29372d08;transition:.15s}.idea-card:hover{border-color:#afc2b2;box-shadow:0 4px 12px #2d4c3710}.idea-card h3{font-size:14px;margin:0 0 7px}.idea-card p{color:#68746c;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;color:#87928a;font-size:10px}.tag{background:#f0f3ef;border-radius:99px;padding:4px 8px}.badge{border-radius:99px;padding:4px 8px;font-size:10px;background:#edf1ec;color:#5d6a60}.badge.progress{background:#fff3d9;color:#946f27}.badge.done{background:#e7f2e8;color:#47764f}.add-card{width:100%;margin-top:10px;padding:8px;text-align:left;border:1px dashed #cbd4cb;background:transparent;border-radius:6px;color:#68776d;cursor:pointer}.add-card:hover{background:#fff}.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.tile-grid .idea-card{min-height:140px;padding:15px}.empty{grid-column:1/-1;min-height:190px;border:1px dashed #cbd4cb;border-radius:9px;display:grid;place-items:center;text-align:center;color:#77837a;padding:28px}.empty strong{display:block;color:#46554b;margin-bottom:7px;font-size:15px}.lane-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:12px}.lane-name{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#a4b49f}.lane[data-status="progress"] .dot{background:#d3a744}.lane[data-status="done"] .dot{background:#5d9b69}.lane-count{font-size:11px;font-weight:500;color:#849087;background:#fff;padding:3px 7px;border-radius:99px}.dropzone{min-height:155px}.work-card{background:white;border:1px solid #e5e9e3;border-radius:7px;padding:12px;line-height:1.5;cursor:grab;box-shadow:0 2px 5px #29372d08}.work-card:active{cursor:grabbing}.work-card h3{font-size:14px;margin:0 0 7px}.work-card p{margin:0;color:#68746c;white-space:pre-wrap}.work-card small{display:block;color:#87928a;margin-top:10px;font-size:10px}.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.detail-title{flex:1}.detail-title h1{margin:0 0 5px}.detail-description{color:#68746c;line-height:1.55;white-space:pre-wrap;margin:6px 0 18px}.detail-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}.detail-tools label,.help{font-size:12px;color:#768279}.detail-tools select,.form select{border:1px solid #dfe4de;border-radius:7px;background:#fff;padding:9px;color:#34443a;font:13px Arial}.updates{margin-top:22px;background:#fff;border:1px solid #e3e8e2;border-radius:9px;padding:16px}.updates h2{font-size:15px;margin:0 0 12px}.update-form{display:flex;gap:8px;align-items:flex-start}.update-form textarea{flex:1;min-height:72px;resize:vertical;border:1px solid #dfe4de;border-radius:7px;padding:10px;font:13px Arial}.update-list{display:grid;gap:8px;margin-top:13px}.update{border-top:1px solid #eef0ed;padding:10px 0 0}.update p{margin:0 0 5px;white-space:pre-wrap;line-height:1.5}.update time{font-size:10px;color:#87928a}.shade{position:fixed;inset:0;background:#14201988;display:none;place-items:center;padding:20px;z-index:5}.shade.show{display:grid}.dialog{width:min(460px,100%);background:#fff;border-radius:12px;padding:22px;box-shadow:0 18px 60px #0002}.dialog h2{margin:0 0 14px;font-size:19px}.dialog label{display:block;font-weight:600;font-size:12px;margin:13px 0 6px}.dialog input,.dialog textarea,.dialog select{width:100%;padding:11px;border:1px solid #dfe4de;border-radius:7px;font:14px Arial;outline:none;background:#fff}.dialog textarea{height:110px;resize:vertical}.dialog input:focus,.dialog textarea:focus,.dialog select:focus{border-color:#829b89;box-shadow:0 0 0 3px #e8f0ea}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#273b30;color:#fff;padding:10px 15px;border-radius:7px;display:none;z-index:10}@media(max-width:760px){.wrap{padding:20px 14px}.head{margin-bottom:26px}.title-row{align-items:flex-start;flex-direction:column}.board{grid-template-columns:1fr}.column{min-height:130px}.detail-head{align-items:flex-start}.detail-title{min-width:150px}.update-form{flex-direction:column}.update-form textarea{width:100%}}
</style></head><body>
<div class="wrap"><header class="head"><div class="brand"><b>✳</b>My Idea Board</div><div class="toolbar"><button class="btn" id="importBtn">Paste / Import</button><button class="btn" id="exportBtn">Export</button></div></header>
<main id="home"><div class="title-row"><div><h1>Ideas</h1><p class="sub">Organize ideas by topic, or browse all projects in Progress.</p></div><div class="toolbar"><button class="btn" id="addTopicBtn">＋ Add topic</button><button class="btn primary" id="addIdeaBtn">＋ Add idea</button></div></div><nav class="tabs"><button class="tab active" data-view="topics">By topic</button><button class="tab" data-view="progress">Progress</button></nav><div class="summary" id="summary"></div><section id="topicView" class="board"></section><section id="progressView" class="tile-grid" hidden></section></main>
<main id="ideaDetail" hidden><header class="detail-head"><button class="btn" id="backBtn">← Back</button><div class="detail-title"><h1 id="detailTitle"></h1><p id="detailTag" class="sub"></p></div></header><p id="detailDescription" class="detail-description"></p><div class="detail-tools"><label for="detailStatus">Move idea:</label><select id="detailStatus"><option value="planned">Planned</option><option value="progress">In progress</option><option value="done">Done</option></select><span class="help" id="completedDate"></span></div><section class="board" id="kanban"></section><section class="updates"><h2>Progress updates</h2><div class="update-form"><textarea id="updateInput" placeholder="Add a progress note or next step..."></textarea><button class="btn primary" id="addUpdateBtn">Add update</button></div><div class="update-list" id="updateList"></div></section></main></div>
<div class="shade" id="shade"><section class="dialog" role="dialog" aria-modal="true"><h2 id="formTitle">New idea</h2><div id="ideaForm"><label for="ideaTitle">Title</label><input id="ideaTitle" placeholder="A short title for your idea"><label for="ideaDescription">Details <span style="font-weight:400;color:#89938c">(optional)</span></label><textarea id="ideaDescription" placeholder="Add a few details..."></textarea><label for="ideaTopic">Topic</label><select id="ideaTopic"></select></div><div id="topicForm" hidden><label for="topicTitle">Topic title</label><input id="topicTitle" placeholder="e.g. Ideas to try"></div><div id="importForm" hidden><p class="help">Paste one idea per line. Use | to put details on a new line within that same idea.</p><label for="importTopic">Add to topic</label><select id="importTopic"></select><label for="importText">Ideas</label><textarea id="importText" placeholder="Idea title | details"></textarea></div><div class="buttons"><button class="btn" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Add idea</button></div></section></div><div class="toast" id="toast"></div>
<script>
const KEY='idea-tracker-v3',V2='idea-tracker-v2',OLD='idea-board-columns-v1',STATES=[['planned','Planned'],['progress','In progress'],['done','Done']];const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function migrate(){let flat=[];try{const v2=JSON.parse(localStorage.getItem(V2)||'null');if(v2){flat=v2;return{topics:[...new Set(flat.map(i=>i.tag).filter(Boolean))].map((title,n)=>({id:'t'+n,title})),ideas:flat}}const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old){const columns=old.columns||old;columns.forEach(c=>{(c.ideas||[]).forEach(x=>{if(typeof x==='string')x={text:x};const parts=(x.text||'').split('\n');flat.push({id:x.id||'i'+Math.random().toString(36).slice(2),title:x.title||parts.shift()||'Untitled idea',description:x.description??parts.join('\n'),tag:x.tag||c.title||'Ideas',status:x.status||'planned',completedAt:x.completedAt||null,updates:x.updates||[]})})});return{topics:columns.map((c,n)=>({id:'t'+n,title:c.title||'Ideas'})),ideas:flat}}}catch{}return{topics:[{id:'t'+Date.now(),title:'Ideas'}],ideas:[]}}let state=JSON.parse(localStorage.getItem(KEY)||'null')||migrate();let view='topics',selected='',mode='idea';if(!state.topics.length)state.topics=[{id:'t'+Date.now(),title:'Ideas'}];state.ideas=state.ideas.map(i=>({...i,topicId:i.topicId||state.topics.find(t=>t.title===i.tag)?.id||state.topics[0].id,status:i.status||'planned',updates:i.updates||[]}));function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function stateLabel(s){return STATES.find(x=>x[0]===s)?.[1]||'Planned'}function card(i,tag=''){return `<article class="idea-card" data-open="${i.id}" tabindex="0"><h3>${esc(i.title)}</h3>${i.description?`<p>${esc(i.description)}</p>`:''}<div class="card-foot"><span class="tag">${esc(tag||i.tag||'Idea')}</span><span class="badge ${i.status}">${stateLabel(i.status)}</span></div></article>`}function counts(){const all=state.ideas;$('#summary').innerHTML=STATES.map(([s,l])=>`<span><b>${all.filter(i=>i.status===s).length}</b> ${l.toLowerCase()}</span>`).join('')}function renderHome(){counts();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));$('#topicView').hidden=view!=='topics';$('#progressView').hidden=view!=='progress';if(view==='topics'){$('#topicView').innerHTML=state.topics.map(t=>`<section class="column"><div class="colhead"><input class="coltitle" data-title="${t.id}" value="${esc(t.title)}" aria-label="Topic title"><button class="remove" data-delete-topic="${t.id}" title="Remove topic">×</button></div><div class="cards">${state.ideas.filter(i=>i.topicId===t.id).map(i=>card(i,t.title)).join('')||''}</div><button class="add-card" data-new-idea="${t.id}">＋ Add an idea</button></section>`).join('')||'<div class="empty">Add a topic to start organizing your ideas.</div>';$('#topicView').querySelectorAll('[data-title]').forEach(el=>el.onchange=()=>{const t=state.topics.find(x=>x.id===el.dataset.title);if(t){t.title=el.value.trim()||'Untitled';persist();renderHome()}});$('#topicView').querySelectorAll('[data-delete-topic]').forEach(el=>el.onclick=()=>{const id=el.dataset.deleteTopic;state.topics=state.topics.filter(t=>t.id!==id);if(!state.topics.length)state.topics.push({id:'t'+Date.now(),title:'Ideas'});state.ideas.filter(i=>i.topicId===id).forEach(i=>i.topicId=state.topics[0].id);persist();renderHome()});$('#topicView').querySelectorAll('[data-new-idea]').forEach(el=>el.onclick=()=>openForm('idea',el.dataset.newIdea))}else{$('#progressView').innerHTML=state.ideas.length?state.ideas.map(i=>card(i,state.topics.find(t=>t.id===i.topicId)?.title||'Idea')).join(''):'<div class="empty"><div><strong>No project ideas yet</strong>Add an idea to see it here.</div></div>'}}function renderKanban(){const i=state.ideas.find(x=>x.id===selected);if(!i)return;$('#detailTitle').textContent=i.title;$('#detailTag').textContent=state.topics.find(t=>t.id===i.topicId)?.title||'Idea';$('#detailDescription').textContent=i.description||'';$('#detailStatus').value=i.status;$('#completedDate').textContent=i.completedAt?'Completed '+i.completedAt:'';$('#kanban').innerHTML=STATES.map(([s,l])=>`<section class="column lane" data-status="${s}"><div class="lane-head"><span class="lane-name"><i class="dot"></i>${l}</span><span class="lane-count">${i.status===s?'1':'0'}</span></div><div class="dropzone" data-drop="${s}">${i.status===s?`<article class="work-card" draggable="true" data-drag="${i.id}"><h3>${esc(i.title)}</h3>${i.description?`<p>${esc(i.description)}</p>`:''}${i.status==='done'&&i.completedAt?`<small>✓ Completed ${esc(i.completedAt)}</small>`:''}</article>`:''}</div></section>`).join('');$('#kanban').querySelectorAll('[data-drop]').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.closest('.lane').style.outline='2px solid #b8cbbc'};el.ondragleave=()=>el.closest('.lane').style.outline='';el.ondrop=e=>{e.preventDefault();el.closest('.lane').style.outline='';changeStatus(el.dataset.drop)}});$('#kanban').querySelectorAll('[data-drag]').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.drag));$('#updateList').innerHTML=i.updates.length?[...i.updates].reverse().map(u=>`<article class="update"><p>${esc(u.text)}</p><time>${esc(u.at)}</time></article>`).join(''):'<p class="help">No updates yet. Add a note as you make progress.</p>'}function changeStatus(s){const i=state.ideas.find(x=>x.id===selected);if(!i)return;i.status=s;i.completedAt=s==='done'?new Date().toLocaleDateString():null;persist();renderHome();renderKanban()}function openIdea(id){selected=id;$('#home').hidden=true;$('#ideaDetail').hidden=false;renderKanban();window.scrollTo(0,0)}function openForm(m,topicId=''){mode=m;$('#formTitle').textContent=m==='topic'?'New topic':m==='import'?'Paste ideas':'New idea';$('#ideaForm').hidden=m!=='idea';$('#topicForm').hidden=m!=='topic';$('#importForm').hidden=m!=='import';$('#saveBtn').textContent=m==='topic'?'Add topic':m==='import'?'Import ideas':'Add idea';if(m==='idea'||m==='import'){const sel=m==='idea'?$('#ideaTopic'):$('#importTopic');sel.innerHTML=state.topics.map(t=>`<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('');if(topicId)sel.value=topicId}$('#ideaTitle').value='';$('#ideaDescription').value='';$('#topicTitle').value='';$('#importText').value='';$('#shade').classList.add('show')}function closeForm(){$('#shade').classList.remove('show')}function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function addIdea(title,description,topicId){state.ideas.unshift({id:'i'+Date.now()+Math.random().toString(36).slice(2,6),title,description,topicId,status:'planned',completedAt:null,updates:[]})}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;renderHome()});$('#topicView').addEventListener('click',e=>{if(e.target.closest('[data-new-idea]'))return;const c=e.target.closest('[data-open]');if(c)openIdea(c.dataset.open)});$('#progressView').addEventListener('click',e=>{const c=e.target.closest('[data-open]');if(c)openIdea(c.dataset.open)});['topicView','progressView'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();openIdea(e.target.dataset.open)}}));$('#addTopicBtn').onclick=()=>openForm('topic');$('#addIdeaBtn').onclick=()=>openForm('idea',state.topics[0]?.id);$('#importBtn').onclick=()=>openForm('import',state.topics[0]?.id);$('#cancelBtn').onclick=closeForm;$('#shade').onclick=e=>{if(e.target===$('#shade'))closeForm()};$('#saveBtn').onclick=()=>{if(mode==='topic'){const title=$('#topicTitle').value.trim();if(!title)return;state.topics.push({id:'t'+Date.now(),title});persist();renderHome();closeForm()}else if(mode==='idea'){const title=$('#ideaTitle').value.trim();if(!title)return;addIdea(title,$('#ideaDescription').value.trim(),$('#ideaTopic').value);persist();renderHome();closeForm()}else{const topicId=$('#importTopic').value,rows=$('#importText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!rows.length)return;rows.forEach(row=>{const [title,...rest]=row.split('|');addIdea(title.trim(),rest.join('\n').trim(),topicId)});persist();renderHome();closeForm();toast(`${rows.length} idea${rows.length===1?'':'s'} imported`)}};$('#backBtn').onclick=()=>{$('#ideaDetail').hidden=true;$('#home').hidden=false;selected='';renderHome();window.scrollTo(0,0)};$('#detailStatus').onchange=()=>changeStatus($('#detailStatus').value);$('#addUpdateBtn').onclick=()=>{const i=state.ideas.find(x=>x.id===selected),text=$('#updateInput').value.trim();if(!i||!text)return;i.updates.push({text,at:new Date().toLocaleString()});$('#updateInput').value='';persist();renderKanban()};$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='my-idea-board.json';a.click();URL.revokeObjectURL(a.href);toast('Board exported')};document.onkeydown=e=>{if(e.key==='Escape')closeForm()};if(!localStorage.getItem(KEY)){persist()}renderHome();
</script></body></html>
